name: Tenant config drift

# Read-only check that orgs/* in Firestore still matches the code tables in
# src/lib/org/config-code.ts. It never writes tenant config: Firestore may hold
# database-only edits, so a person runs the seed script with --apply after
# reading the difference. On drift the job fails and opens (or updates) the
# issue "Tenant config drift" with the differing field NAMES only; values are
# never printed, because this repository's logs are public.
# Identity: the same keyless gh-rules-deployer service account (read-only
# roles/datastore.viewer for this job). See docs/ops/CI-DEPLOY.md.

on:
  push:
    branches: [master]
    paths:
      - src/lib/org/config-code.ts
      - src/lib/org/config-schema.ts
      - scripts/ops/multitenant/seed-org-configs.ts
      - .github/workflows/tenant-config-drift.yml
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: tenant-config-drift
  cancel-in-progress: false

jobs:
  drift:
    name: Compare orgs/* with config-code.ts (dry run)
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/749316879158/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: gh-rules-deployer@crcmusiccharts.iam.gserviceaccount.com

      - name: Seed dry run (--check)
        id: check
        env:
          DRIFT_REPORT_FILE: ${{ runner.temp }}/drift.json
          SKIP_ENV_VALIDATION: '1'
        run: |
          set +e
          npx vite-node -c vitest.config.ts scripts/ops/multitenant/seed-org-configs.ts -- --check
          code=$?
          set -e
          if [ "$code" = "3" ]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" != "0" ]; then
            echo "Seed dry run failed (exit $code)"
            exit "$code"
          fi

      - name: Open or update the drift issue
        if: steps.check.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRIFT_REPORT_FILE: ${{ runner.temp }}/drift.json
        run: |
          body_file="$RUNNER_TEMP/issue.md"
          {
            echo "The tenant config in Firestore (\`orgs/*\`) differs from \`src/lib/org/config-code.ts\`."
            echo
            echo "Fields that differ, by org:"
            echo
            node -e 'const d=require(process.env.DRIFT_REPORT_FILE);for(const[id,ks]of Object.entries(d))console.log(`- \`orgs/${id}\`: ${ks.map(k=>"`"+k+"`").join(", ")}`)'
            echo
            echo "Nothing was written. Values are not shown here (public logs). To see them, run the seed dry run locally:"
            echo "\`npx vite-node -c vitest.config.ts scripts/ops/multitenant/seed-org-configs.ts\`"
            echo "Then either change the code to match a deliberate database edit, or run it with \`-- --apply\`."
            echo
            echo "Detected by $RUN_URL"
          } > "$body_file"
          num=$(gh issue list --repo "$REPO" --state open --search 'in:title "Tenant config drift"' --json number,title --jq '[.[] | select(.title == "Tenant config drift")][0].number // empty')
          if [ -n "$num" ]; then
            gh issue edit "$num" --repo "$REPO" --body-file "$body_file"
            gh issue comment "$num" --repo "$REPO" --body "Still drifting as of $RUN_URL"
          else
            gh issue create --repo "$REPO" --title "Tenant config drift" --body-file "$body_file"
          fi

      - name: Fail on drift
        if: steps.check.outputs.drift == 'true'
        run: |
          echo "::error::Tenant config drift: orgs/* differs from config-code.ts (see the 'Tenant config drift' issue)"
          exit 1
