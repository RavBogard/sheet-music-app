name: CI

# C5D-006: third-party actions are SHA-pinned (immutable refs) per
# supply-chain hardening. Floating `@v4` tags can be silently re-pointed
# by a compromised maintainer; SHA pins make every CI run reproducible.
# Dependabot (`.github/dependabot.yml`) opens PRs when upstream releases
# new patch versions so pins stay current.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: TypeScript Check
        run: npx tsc --noEmit

      # BR-19: the app↔bridge monitor type mirror (src/types/monitor.ts ↔
      # bridge/src/types.ts) drifted unnoticed once (BR-04: bridge missed the
      # BusAssignment[] variant → musicians locked out of their faders). The
      # check:types guard existed but was never wired into a gate. This step
      # makes any future drift a HARD CI FAILURE.
      - name: Monitor type-mirror sync (app ↔ bridge)
        run: npm run check:types

      - name: ESLint
        run: npx eslint src/ --quiet --max-warnings 0

  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Run Tests
        run: npx vitest run --reporter=verbose

  # R-0904-live-cw-21 §2, adopted by R-0904-live-cw-23 on Daniel's word.
  #
  # THE REQUIRED CHECK. `Unit & Integration Tests` above runs the WHOLE suite
  # and stays NOT required, so the full number remains visible on every push
  # instead of hiding behind this subset. This job runs the same suite MINUS
  # the files in `ci/gated-suite-exclusions.txt` — the counted test debt — and
  # IS required on `master` alongside `Build Check`.
  #
  # THE NAME IS LOAD-BEARING. Branch protection pins a check by its name
  # string, so `Gated Unit Suite` must not be re-worded without re-running the
  # `gh api .../branches/master/protection` call. A renamed job silently
  # becomes a check that is required and never reports, which blocks every
  # push with no failure to read.
  #
  # When the exclusion list reaches empty, this job is DELETED and
  # `Unit & Integration Tests` becomes the required check (R-0904-live-cw-21
  # §2(c)).
  gated-unit-suite:
    name: Gated Unit Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The remove-only guard diffs the exclusion list against its own
          # previous state, so it needs more than the tip commit. `0` rather
          # than `2`: on a pull_request the baseline is the MERGE BASE, which
          # can be many commits back.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # R-0904-live-cw-21 §2(c). Runs BEFORE the suite: if this push tried to
      # hide a failing test, that is the finding, and a green subset computed
      # from a grown list would bury it.
      - name: Exclusion list is remove-only
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
            # A new branch's first push reports before=000…0; fall back to the
            # tip's parent so the guard still has a baseline to diff.
            case "$BASE" in
              ''|*[!0]*) ;;
              *) BASE="$(git rev-parse HEAD^ 2>/dev/null || echo HEAD)" ;;
            esac
          fi
          bash ci/check-exclusions-remove-only.sh "$BASE"

      - name: Run gated suite
        run: npx vitest run --config vitest.gated.config.ts --reporter=verbose

  # v54-02-01: Harness Fidelity Gate phase 1. Runs the *.emulator.test.ts
  # subset against a real Firebase Local Emulator Suite (Firestore + Auth)
  # to catch v5h3-01-class cache-vs-fresh races the in-memory FakeFirestore
  # adapter misses. Local devs need Java JDK 11+ on PATH; CI uses
  # actions/setup-java@v4 so this gate doesn't depend on local installs.
  emulator-tests:
    name: Emulator Tests (Firestore + Auth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - run: npm ci

      - name: Cache Firebase emulator binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ hashFiles('firebase.json') }}

      - name: Run emulator tests
        run: npm run test:emulator:ci
        env:
          SKIP_ENV_VALIDATION: '1'

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'test-project' }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY || 'test-key' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'test.firebaseapp.com' }}

  e2e-smoke:
    name: E2E Smoke (Playwright)
    runs-on: ubuntu-latest
    needs: build-check
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'test-project' }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY || 'test-key' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'test.firebaseapp.com' }}

      - name: Run Playwright smoke
        run: npx playwright test --project=chromium
        env:
          CI: 'true'
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'test-project' }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY || 'test-key' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'test.firebaseapp.com' }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
