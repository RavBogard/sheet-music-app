name: Deploy Firestore and Storage rules

# Deploys firestore.rules, storage.rules and firestore.indexes.json to the
# crcmusiccharts project when they change on master. Keyless: GitHub OIDC ->
# GCP Workload Identity Federation -> service account gh-rules-deployer, whose
# only project roles are listed in docs/ops/CI-DEPLOY.md. The WIF provider only
# accepts tokens from this repository on refs/heads/master, so pull requests and
# other branches cannot obtain the identity.

on:
  push:
    branches: [master]
    paths:
      - firestore.rules
      - storage.rules
      - firestore.indexes.json
      - .github/workflows/deploy-rules.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-rules
  cancel-in-progress: false

jobs:
  deploy:
    name: firebase deploy (rules + indexes)
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/749316879158/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: gh-rules-deployer@crcmusiccharts.iam.gserviceaccount.com

      - name: Deploy
        run: npx firebase deploy --only firestore:rules,storage,firestore:indexes --project crcmusiccharts --non-interactive
