<!DOCTYPE html>
<html>

<head>
    <title>CentralReform Bridge</title>
    <style>
        :root {
            --bg: #1e1e2e;
            --surface: #313244;
            --text: #cdd6f4;
            --subtext: #a6adc8;
            --accent: #cba6f7;
            --green: #a6e3a1;
            --red: #f38ba8;
            --yellow: #f9e2af;
        }

        body {
            margin: 0;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            -webkit-user-select: none;
            user-select: none;
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 24px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
            flex: 1;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 99px;
            font-size: 13px;
            font-weight: 600;
            background: var(--surface);
            color: var(--subtext);
        }

        .status-badge.online {
            background: rgba(166, 227, 161, 0.15);
            color: var(--green);
        }

        .status-badge.offline {
            background: rgba(243, 139, 168, 0.15);
            color: var(--red);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .card {
            background: var(--surface);
            border-radius: 12px;
            padding: 16px;
        }

        .card-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--subtext);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .card-value {
            font-size: 18px;
            font-family: monospace;
            color: var(--text);
        }

        .card-link {
            color: var(--accent);
            text-decoration: underline;
            cursor: pointer;
            font-size: 14px;
            display: inline-block;
            margin-top: 4px;
        }

        .logs {
            background: #11111b;
            border-radius: 12px;
            padding: 16px;
            height: 250px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 13px;
            line-height: 1.5;
        }

        .log-line {
            margin: 0;
            padding: 2px 0;
            word-break: break-all;
        }

        .log-line.info {
            color: var(--text);
        }

        .log-line.warn {
            color: var(--yellow);
        }

        .log-line.error {
            color: var(--red);
        }

        .empty-logs {
            color: var(--subtext);
            font-style: italic;
        }

        /* Setup Overlay */
        .setup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(30, 30, 46, 0.95);
            backdrop-filter: blur(8px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .setup-overlay.active {
            display: flex;
        }

        .setup-card {
            background: var(--surface);
            padding: 32px;
            border-radius: 16px;
            width: 320px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .setup-card h2 {
            margin-top: 0;
            font-size: 20px;
        }

        .setup-card p {
            color: var(--subtext);
            font-size: 13px;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .input-group {
            text-align: left;
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--subtext);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .input-group input {
            width: 100%;
            background: #181825;
            border: 1px solid #45475a;
            color: var(--text);
            padding: 10px 12px;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .setup-btn {
            background: var(--accent);
            color: #11111b;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 8px;
        }

        .setup-btn:hover {
            opacity: 0.9;
        }

        .setup-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .setup-error {
            color: var(--red);
            font-size: 13px;
            margin-top: 12px;
            min-height: 20px;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>CentralReform Bridge</h1>
        <div id="connection-status" class="status-badge offline">X32 Offline</div>
    </div>

    <div class="grid">
        <div class="card">
            <div class="card-label">Mixer Address</div>
            <div id="x32-address" class="card-value">Scanning...</div>
        </div>
        <div class="card">
            <div class="card-label">Connected iPads</div>
            <div id="client-count" class="card-value">0</div>
        </div>
        <div class="card" style="grid-column: span 2;">
            <div class="card-label">Certificate Trust URL</div>
            <div id="trust-url" class="card-value" style="color: var(--subtext); font-size: 14px;">Waiting for
                network...</div>
            <div class="card-link" id="trust-link" style="display: none;" onclick="openTrustUrl()">Open Locally</div>
        </div>
    </div>

    <div class="card-label">Live Logs</div>
    <div class="logs" id="logs-container">
        <div class="empty-logs">Bridge is starting up...</div>
    </div>

    <!-- Setup Overlay -->
    <div id="setup-overlay" class="setup-overlay">
        <div class="setup-card">
            <h2>Bridge Setup</h2>
            <p>Connect this bridge to your CentralReform cloud account via a 6-digit setup code.</p>

            <div class="input-group">
                <label>App URL</label>
                <input type="url" id="setup-url" placeholder="https://..."
                    value="https://centralreform.firebaseapp.com" />
            </div>

            <div class="input-group">
                <label>6-Digit Code</label>
                <input type="text" id="setup-code" placeholder="123456" maxlength="6"
                    style="letter-spacing: 2px; text-align: center; font-size: 18px;" />
            </div>

            <button id="setup-btn" class="setup-btn" onclick="submitSetup()">Connect Bridge</button>
            <div id="setup-error" class="setup-error"></div>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        const logsContainer = document.getElementById('logs-container');
        const statusBadge = document.getElementById('connection-status');
        const x32Address = document.getElementById('x32-address');
        const clientCount = document.getElementById('client-count');
        const trustUrl = document.getElementById('trust-url');
        const trustLink = document.getElementById('trust-link');

        let currentTrustHref = "";

        ipcRenderer.on('log', (event, { level, message }) => {
            if (logsContainer.querySelector('.empty-logs')) {
                logsContainer.innerHTML = '';
            }

            const div = document.createElement('div');
            div.className = `log-line ${level}`;

            // Format time
            const time = new Date().toLocaleTimeString([], { hour12: false });
            div.textContent = `[${time}] ${message}`;

            logsContainer.appendChild(div);

            // Auto-scroll
            if (logsContainer.scrollHeight - logsContainer.scrollTop < 350) {
                logsContainer.scrollTop = logsContainer.scrollHeight;
            }
        });

        ipcRenderer.on('status', (event, status) => {
            if (!status) return;

            // X32 Connection Status
            if (status.x32Connected !== undefined) {
                if (status.x32Connected) {
                    statusBadge.textContent = 'X32 Connected';
                    statusBadge.className = 'status-badge online';
                } else {
                    statusBadge.textContent = 'X32 Offline';
                    statusBadge.className = 'status-badge offline';
                }
            }

            // Addresses
            if (status.x32Address) {
                x32Address.textContent = status.x32Address;
            }

            if (status.connectedClients !== undefined) {
                clientCount.textContent = status.connectedClients;
            }

            if (status.bridgeUrl) {
                const u = new URL(status.bridgeUrl.replace('wss://', 'https://').replace('ws://', 'http://'));
                const urlStr = u.toString().replace(/\/$/, "");
                trustUrl.textContent = urlStr;
                trustUrl.style.color = "var(--text)";
                currentTrustHref = urlStr;
                trustLink.style.display = "inline-block";
            }
        });

        function openTrustUrl() {
            if (currentTrustHref) {
                ipcRenderer.send('open-external', currentTrustHref + "/trust");
            }
        }

        // Setup Overlay Logic
        const setupOverlay = document.getElementById('setup-overlay');
        const setupUrlBtn = document.getElementById('setup-url');
        const setupCodeBtn = document.getElementById('setup-code');
        const setupBtn = document.getElementById('setup-btn');
        const setupError = document.getElementById('setup-error');

        ipcRenderer.on('require-setup', () => {
            setupOverlay.classList.add('active');
            setupCodeBtn.focus();
        });

        async function submitSetup() {
            const appUrl = setupUrlBtn.value.trim().replace(/\/$/, "");
            const code = setupCodeBtn.value.trim();

            if (!appUrl || !code) {
                setupError.textContent = "Please enter both URL and Code";
                return;
            }

            setupBtn.disabled = true;
            setupBtn.textContent = "Connecting...";
            setupError.textContent = "";

            try {
                const response = await ipcRenderer.invoke('submit-setup-code', { appUrl, code });
                if (response.success) {
                    setupOverlay.classList.remove('active');
                } else {
                    setupError.textContent = response.error || "Failed to verify setup code.";
                    setupBtn.disabled = false;
                    setupBtn.textContent = "Connect Bridge";
                }
            } catch (err) {
                setupError.textContent = "Connection error. Check app URL.";
                setupBtn.disabled = false;
                setupBtn.textContent = "Connect Bridge";
            }
        }
    </script>
</body>

</html>
